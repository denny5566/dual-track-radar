services:
  radar:
    build: .
    # Oracle VM 上用 --env-file 注入，不寫死 key
    env_file: .env
    environment:
      - TZ=Asia/Taipei
    volumes:
      # 持久化資料庫與輸出 JSON（容器重建不遺失）
      - ./data:/app/data
      - ./output:/app/output
      # pipeline 寫入 web/public/data，讓 web service 能即時讀到
      - ./web/public/data:/app/web/public/data
      - ./web/public/images:/app/web/public/images
      # 影片渲染輸出（video/out/）+ Instagram 公開 URL 路徑（web/public/videos/）
      - ./video/out:/app/video/out
      - ./web/public/videos:/app/web/public/videos
    restart: "no"   # 由 crontab 觸發，不需要自動重啟

  discord-bot:
    build: .
    env_file: .env
    environment:
      - TZ=Asia/Taipei
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./cookies.txt:/app/cookies.txt       # YouTube cookies（解決 bot 偵測）
      - ./web/public/data:/app/web/public/data   # 發布至網站（step_save_db 寫入）
      - ./web/public/images:/app/web/public/images
      - ./cache:/root/.cache                 # OAuth2 token 持久化（重建容器不遺失）
    command: ["python", "discord_bot.py"]
    restart: unless-stopped   # Bot 要常駐，異常退出後自動重啟

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "80:3000"
    volumes:
      # pipeline 每次執行後更新 data/images，web service 直接讀 volume
      - ./web/public/data:/app/public/data
      - ./web/public/images:/app/public/images
      # 渲染後的影片（供 Instagram 公開 URL）
      - ./web/public/videos:/app/public/videos
    restart: unless-stopped   # 前端常駐，異常退出後自動重啟
