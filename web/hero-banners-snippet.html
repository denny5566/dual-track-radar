  Fintech SaaS Hero Banners (HTML + CSS + JS)
  Usage:
  1) Put the <section class="hero-rotator">...</section> into your homepage hero area
  2) Put the <style> block into your CSS (or keep inline)
  3) Put the <script> block before </body>
========================================================= -->

<style>

  .hero-shell {

<script>
  (function initHeroRotator() {
    const root = document.querySelector('.hero-rotator');
    if (!root) return;

    const slides = Array.from(root.querySelectorAll('.hero-slide'));
    const dotsWrap = root.querySelector('#hero-dots');
    const prevBtn = root.querySelector('#hero-prev');
    const nextBtn = root.querySelector('#hero-next');
    if (!slides.length || !dotsWrap || !prevBtn || !nextBtn) return;

    let idx = 0;
    let timer = null;
    const intervalMs = 6200;

    const dots = slides.map((_, i) => {
      const b = document.createElement('button');
      b.className = 'hero-dot' + (i === 0 ? ' is-active' : '');
      b.type = 'button';
      b.setAttribute('aria-label', '切換到第 ' + (i + 1) + ' 張 Banner');
      b.addEventListener('click', () => {
        goTo(i);
        restartAuto();
      });
      dotsWrap.appendChild(b);
      return b;
    });

    function goTo(next) {
      idx = (next + slides.length) % slides.length;
      slides.forEach((s, i) => s.classList.toggle('is-active', i === idx));
      dots.forEach((d, i) => d.classList.toggle('is-active', i === idx));
    }

    function next() { goTo(idx + 1); }
    function prev() { goTo(idx - 1); }

    function startAuto() {
      if (timer) return;
      timer = setInterval(next, intervalMs);
    }

    function stopAuto() {
      if (!timer) return;
      clearInterval(timer);
      timer = null;
    }

    function restartAuto() {
      stopAuto();
      startAuto();
    }

    nextBtn.addEventListener('click', () => { next(); restartAuto(); });
    prevBtn.addEventListener('click', () => { prev(); restartAuto(); });

    root.addEventListener('mouseenter', stopAuto);
    root.addEventListener('mouseleave', startAuto);
    root.addEventListener('focusin', stopAuto);
    root.addEventListener('focusout', startAuto);

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stopAuto();
      else startAuto();
    });

    startAuto();
  })();
</script>
