<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

  <!-- Reading Progress -->
  <div id="reading-progress" class="reading-progress" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>

  <!-- Live Market Ticker -->
  <div class="ticker-wrap">
    <div class="ticker-badge">LIVE</div>
    <div class="ticker-scroll-area">
      <div class="ticker-track" id="ticker-track">

  <!-- Header -->

          <polyline points="12 19 5 12 12 5"/>

        <span>返回</span>

      <a href="/" class="logo logo-sm" aria-label="財經雷達首頁">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">

    <!-- Headline -->
    <h1 class="article-headline" id="article-headline">
      <span class="skeleton sk-headline"></span>
    </h1>

    <!-- Meta row -->
    <div class="article-meta" id="article-meta">
      <span class="meta-item">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        <span id="reading-time">閱讀約 3 分鐘</span>
      </span>
      <span class="meta-item meta-ai">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">

        </svg>
        AI 生成
      </span>
    </div>

    <!-- Share Row -->
    <div class="share-row">
      <span class="share-label">分享</span>
      <a class="share-btn share-line" id="share-line" href="#" target="_blank" rel="noopener" aria-label="分享到 LINE">

        LINE
      </a>
      <a class="share-btn share-fb" id="share-fb" href="#" target="_blank" rel="noopener" aria-label="分享到 Facebook">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        Facebook
      </a>
      <button class="share-btn share-copy" id="share-copy" aria-label="複製連結">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        複製連結
      </button>
    </div>

    <!-- Cover Image (Hero — top of article) -->
    <figure class="article-cover" id="article-cover" hidden>
      <div class="cover-img-wrap">
        <img id="cover-img" alt="">
      </div>
      <figcaption class="cover-caption">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
        </svg>
        圖片來源：Pexels · 僅供示意
      </figcaption>
    </figure>

    <div class="divider"></div>

    <!-- Body + Sidebar -->
    <div class="content-grid">

      <main class="article-body" id="article-body">
        <div id="article-content">
          <div class="skeleton sk-block" style="height:1.2rem;width:45%;margin-bottom:.75rem"></div>
          <div class="skeleton sk-text"></div>
          <div class="skeleton sk-text"></div>
          <div class="skeleton sk-text short"></div>
          <div class="skeleton sk-block" style="height:1.2rem;width:55%;margin-top:2rem;margin-bottom:.75rem"></div>
          <div class="skeleton sk-text"></div>
          <div class="skeleton sk-text short"></div>
        </div>
      </main>

      <aside class="sidebar" id="sidebar">
        <div class="skeleton sk-block" style="height:160px;margin-bottom:1rem"></div>
        <div class="skeleton sk-block" style="height:200px;margin-bottom:1rem"></div>
        <div class="skeleton sk-block" style="height:200px"></div>
      </aside>

    </div>

    <!-- Tags -->
    <div class="tags-row" id="tags-row"></div>

    <!-- Footer -->
    <footer class="article-footer">
      <div class="disclaimer">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        本文由 AI 自動整合財經資訊生成，僅供學術研究與市場觀察參考，不構成任何投資建議。
      </div>
      <p class="footer-copy">&copy; 2026 <a href="https://denny5566.github.io/my_portfolio/" target="_blank" rel="noopener noreferrer">Denny</a></p>
    </footer>
  </div>

  <!-- AI Chat Overlay -->
  <div class="ai-drawer-overlay" id="ai-overlay"></div>

  <!-- AI Chat Drawer -->
  <aside class="ai-drawer" id="ai-drawer" aria-label="AI 財經分析助手" role="complementary">
    <div class="ai-drawer-header">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/>
        <circle cx="12" cy="12" r="4.5"/>
        <circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/>
        <line x1="12" y1="3" x2="12" y2="5.5"/>
        <line x1="12" y1="18.5" x2="12" y2="21"/>
        <line x1="3" y1="12" x2="5.5" y2="12"/>
        <line x1="18.5" y1="12" x2="21" y2="12"/>
        <line x1="12" y1="12" x2="18.5" y2="5.5" stroke-width="1.2"/>
      </svg>
      <span class="ai-drawer-title">雷達 AI 分析</span>
      <button class="ai-drawer-close" id="ai-close" aria-label="關閉">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="ai-chat-messages" id="ai-messages">
      <div class="ai-msg assistant">
        你好！我是<strong>財經雷達 AI 助手</strong>。<br><br>
        我可以幫你：<br>
        · 解析今日報告的重點與數據<br>
        · 說明財經術語或指標（EPS、費半、殖利率等）<br>
        · 延伸討論台股、美股的市場結構<br>
        · 對比雙軌觀點，梳理分歧與共識<br><br>
        點擊下方問題快速開始，或直接輸入你想問的 👇
      </div>
    </div>

    <div class="ai-suggestions" id="ai-suggestions">
      <button class="ai-suggestion-btn">今日最重要的市場訊號是什麼？</button>
      <button class="ai-suggestion-btn">兩位分析師的觀點有何分歧？</button>
      <button class="ai-suggestion-btn">今日提到的關鍵支撐壓力位在哪裡？</button>
      <button class="ai-suggestion-btn">目前市場情緒偏多還是偏空？</button>
      <button class="ai-suggestion-btn">費半是什麼？對台股有何影響？</button>
      <button class="ai-suggestion-btn">短線操作需要注意哪些風險？</button>
    </div>

    <div class="ai-chat-footer">
      <textarea class="ai-chat-input" id="ai-input" placeholder="問我今日報告、市場解析、財經術語…" rows="1"></textarea>
      <button class="ai-chat-send" id="ai-send" aria-label="送出">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </aside>

  <!-- FAB: Radar / AI -->
  <button class="fab" id="fab" aria-label="AI 雷達分析" title="AI 雷達分析">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="9"/>
      <circle cx="12" cy="12" r="4.5"/>
      <circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/>
      <line x1="12" y1="3" x2="12" y2="5.5"/>
      <line x1="12" y1="18.5" x2="12" y2="21"/>
      <line x1="3" y1="12" x2="5.5" y2="12"/>
      <line x1="18.5" y1="12" x2="21" y2="12"/>
      <line x1="12" y1="12" x2="18.5" y2="5.5" stroke-width="1.2"/>
